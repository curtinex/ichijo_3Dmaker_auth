<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickable Canvas</title>
    <style>
        body { margin: 0; padding: 0; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let backgroundImage = new Image();

        // Python側で置換されるプレースホルダー
        const imageDataUrl = "__IMAGE_DATA_URL__";
        canvas.width = __CANVAS_WIDTH__;
        canvas.height = __CANVAS_HEIGHT__;

        backgroundImage.src = imageDataUrl;
        backgroundImage.onload = () => {
            ctx.drawImage(backgroundImage, 0, 0);
        };

        // Canvasクリック時の処理
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            // Streamlitに座標を送信
            window.parent.postMessage({
                isStale: true, // Streamlitに再実行を促す
                type: "streamlit:setComponentValue",
                value: { x: x, y: y }
            }, "*");
        });

        // Streamlitにコンポーネントの準備ができたことを通知
        window.parent.postMessage({
            isStale: true,
            type: "streamlit:setFrameHeight",
            height: canvas.height
        }, "*");

    </script>
</body>
</html>
